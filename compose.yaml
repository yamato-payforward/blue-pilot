services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # ホスト側でローカル PostgreSQL が 5432 を使っている場合の競合を避けるため 5433 にマッピング
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0"
    volumes:
      # ソースコードをマウント (gem はイメージ内 /usr/local/bundle に保持)
      - .:/rails
    ports:
      # ホスト側で別アプリが 3000 を使っている場合の競合を避けるため 3001 にマッピング
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      DATABASE_PORT: 5432
      RAILS_ENV: development
    tty: true
    stdin_open: true

volumes:
  postgres_data:
